<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" role="img"><title>Context Window Architecture wiring</title><desc>Producers send batches to the application, which freezes a snapshot using profiles and route policies from a registry. The assembler validates, admits, resolves conflicts, supersedes, deduplicates, caps, fits, renders and traces it, ending assembled, refused or rejected. The application hands the payload to the model, and tool results feed the next call. Below: this repository generates conformance cases that the four assemblers vendor; their reports are imported into implementations/ and counted on the website.</desc><style>
.s,.b,.b2,.h,.lbl{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;fill:#1f2328}
.h{font-size:16px;font-weight:600}
.b{font-size:15px;font-weight:600}
.s{font-size:13px}
.b2{font-size:13px;font-weight:600}
.it{font-style:italic;fill:#59636e}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:12.5px;fill:#1f2328}
.lbl{font-size:12px;fill:#59636e}
.ln{stroke:#8c959f;stroke-width:1.6}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs><rect width="1000" height="650" fill="#ffffff"/><rect x="10" y="10" width="980" height="462" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="28" y="38" class="h" text-anchor="start">At run time: one model call</text><text x="972" y="38" class="lbl" text-anchor="end">SPEC.md sections 2 to 6</text><rect x="28" y="58" width="172" height="236" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/><text x="42" y="83" class="b" text-anchor="start">Producers</text><text x="42" y="105" class="s" text-anchor="start">retrieval</text><text x="42" y="124" class="s" text-anchor="start">memory</text><text x="42" y="143" class="s" text-anchor="start">state</text><text x="42" y="162" class="s" text-anchor="start">MCP adapter</text><text x="42" y="181" class="s" text-anchor="start">capability policy</text><text x="42" y="200" class="s" text-anchor="start">history, query</text><text x="42" y="236" class="s" text-anchor="start">emit typed items and</text><text x="42" y="255" class="s" text-anchor="start">report what they</text><text x="42" y="274" class="s" text-anchor="start">suppress</text><rect x="256" y="58" width="200" height="186" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="270" y="83" class="b" text-anchor="start">Application</text><text x="270" y="105" class="s" text-anchor="start">authenticates producers</text><text x="270" y="124" class="s" text-anchor="start">reads the clock once</text><text x="270" y="143" class="s" text-anchor="start">declares conflict groups</text><text x="270" y="162" class="s" text-anchor="start">sets route, profile, budget,</text><text x="270" y="181" class="s" text-anchor="start">tokenizer and renderer</text><text x="270" y="230" class="b2" text-anchor="start">freezes one snapshot</text><rect x="256" y="262" width="200" height="72" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="270" y="287" class="b" text-anchor="start">Registry</text><text x="270" y="309" class="s" text-anchor="start">profiles, route policies</text><text x="270" y="328" class="s" text-anchor="start">pinned by digest</text><polyline points="356,262 356,248" fill="none" class="ln" marker-end="url(#a)"/><rect x="512" y="58" width="224" height="276" rx="10" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/><text x="526" y="83" class="b" text-anchor="start">Assembler</text><text x="526" y="104" class="s it" text-anchor="start">no I/O, clock or model calls</text><text x="526" y="130" class="m" text-anchor="start">1  validate</text><text x="526" y="151" class="m" text-anchor="start">2  admit, fill defaults</text><text x="526" y="172" class="m" text-anchor="start">3  resolve conflicts</text><text x="526" y="193" class="m" text-anchor="start">4  supersede</text><text x="526" y="214" class="m" text-anchor="start">5  deduplicate</text><text x="526" y="235" class="m" text-anchor="start">6  cap per source</text><text x="526" y="256" class="m" text-anchor="start">7  refuse or fit budget</text><text x="526" y="277" class="m" text-anchor="start">8  render, count, hash</text><text x="526" y="298" class="m" text-anchor="start">9  trace every decision</text><polyline points="200,150 252,150" fill="none" class="ln" marker-end="url(#a)"/><text x="226" y="140" class="lbl" text-anchor="middle">batches</text><polyline points="456,150 508,150" fill="none" class="ln" marker-end="url(#a)"/><text x="482" y="140" class="lbl" text-anchor="middle">snapshot</text><rect x="776" y="58" width="186" height="70" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/><text x="790" y="83" class="b" text-anchor="start">Assembled</text><text x="790" y="105" class="s" text-anchor="start">payload bytes and trace,</text><text x="790" y="124" class="s" text-anchor="start">with result.hash</text><polyline points="736,196 756,196 756,93 772,93" fill="none" class="ln" marker-end="url(#a)"/><rect x="776" y="142" width="186" height="70" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/><text x="790" y="167" class="b" text-anchor="start">Refused</text><text x="790" y="189" class="s" text-anchor="start">trace with a reason</text><text x="790" y="208" class="s" text-anchor="start">code, no payload</text><polyline points="736,196 756,196 756,177 772,177" fill="none" class="ln" marker-end="url(#a)"/><rect x="776" y="226" width="186" height="70" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="790" y="251" class="b" text-anchor="start">Rejected</text><text x="790" y="273" class="s" text-anchor="start">snapshot fails a check:</text><text x="790" y="292" class="s" text-anchor="start">no payload, no trace</text><polyline points="736,196 756,196 756,261 772,261" fill="none" class="ln" marker-end="url(#a)"/><rect x="776" y="350" width="186" height="70" rx="10" fill="#eaeef2" stroke="#59636e" stroke-width="1.5"/><text x="790" y="375" class="b" text-anchor="start">Model</text><text x="790" y="397" class="s" text-anchor="start">receives the payload</text><text x="790" y="416" class="s" text-anchor="start">with no added text</text><polyline points="962,93 976,93 976,385 966,385" fill="none" class="ln" marker-end="url(#a)"/><polyline points="869,420 869,446 114,446 114,298" fill="none" class="ln" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="490" y="439" class="lbl" text-anchor="middle">answer or tool call, checked by the tool guard; results feed the next call, which freezes a new snapshot</text><rect x="10" y="486" width="980" height="154" rx="14" fill="#f6f8fa" stroke="#d1d9e0" stroke-width="1.5"/><text x="28" y="514" class="h" text-anchor="start">In this repository: the contract every assembler is tested against</text><rect x="28" y="530" width="166" height="92" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="42" y="555" class="b" text-anchor="start">Contract</text><text x="42" y="577" class="m" text-anchor="start">SPEC.md</text><text x="42" y="597" class="m" text-anchor="start">contract/, schema/</text><polyline points="194,576 215,576" fill="none" class="ln" marker-end="url(#a)"/><rect x="219" y="530" width="166" height="92" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="233" y="555" class="b" text-anchor="start">Conformance</text><text x="233" y="577" class="m" text-anchor="start">cases/</text><text x="233" y="597" class="m" text-anchor="start">rejections/</text><polyline points="385,576 406,576" fill="none" class="ln" marker-end="url(#a)"/><rect x="410" y="530" width="166" height="92" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="424" y="555" class="b" text-anchor="start">Assemblers</text><text x="424" y="577" class="s" text-anchor="start">Python, TypeScript,</text><text x="424" y="597" class="s" text-anchor="start">Go, Rust</text><polyline points="576,576 597,576" fill="none" class="ln" marker-end="url(#a)"/><rect x="601" y="530" width="166" height="92" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="615" y="555" class="b" text-anchor="start">Reports</text><text x="615" y="577" class="m" text-anchor="start">implementations/</text><text x="615" y="597" class="m" text-anchor="start">import_report.py</text><polyline points="767,576 788,576" fill="none" class="ln" marker-end="url(#a)"/><rect x="792" y="530" width="166" height="92" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="806" y="555" class="b" text-anchor="start">Website</text><text x="806" y="577" class="s" text-anchor="start">Assembler page</text><text x="806" y="597" class="s" text-anchor="start">counts each report</text><polyline points="560,530 560,338" fill="none" class="ln" marker-end="url(#a)" stroke-dasharray="5 4"/><text x="568" y="464" class="lbl" text-anchor="start">implements</text></svg>
