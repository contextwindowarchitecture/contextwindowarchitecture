# This repository's files against the website: each is the file the website publishes there, none is missing, and
# none has been added beside them. A push is checked against the website commit the lock names. A tag runs it
# through release.yml, against the website at the same tag. The website writes this file too
# (scripts/export-spec.mjs).
name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: The commit to check; release.yml passes the tag
        type: string
        default: ""
      website_ref:
        description: The website ref to check against; release.yml passes the same tag
        type: string
        default: ""

permissions:
  contents: read

jobs:
  export:
    name: files match the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - id: lock
        run: echo "commit=$(python3 -c 'import json; print(json.load(open("website.lock.json"))["website_commit"])')" >> "$GITHUB_OUTPUT"
      # The commit or tag must be pushed to the website repository for this checkout to find it.
      - uses: actions/checkout@v5
        with:
          repository: contextwindowarchitecture/website
          ref: ${{ inputs.website_ref || steps.lock.outputs.commit }}
          path: website
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node scripts/export-spec.mjs .. --check
        working-directory: website
