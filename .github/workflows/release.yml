# A GitHub release for each tag, made once ci passes on the tagged commit. The notes give the draft's date and the
# newest revision in CHANGES.md. A tag that is not vX.Y.Z, such as draft-release, is a prerelease. An existing tag is
# released by hand: gh workflow run release.yml -f tag=<tag>
name: release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The existing tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  release:
    name: GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - run: |
          python3 - > notes.md <<'PY'
          import re
          draft = re.search(r"^Draft of (\d{4}-\d{2}-\d{2})", open("SPEC.md", encoding="utf-8").read(), re.M)
          heading, _, body = re.split(r"^## ", open("CHANGES.md", encoding="utf-8").read(), flags=re.M)[1].partition("\n")
          print(f"Draft of {draft.group(1) if draft else 'unknown date'}. The newest revision, {heading.strip()}:\n\n{body.strip()}\n\nEvery revision is in CHANGES.md.")
          PY
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || prerelease=(--prerelease)
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
